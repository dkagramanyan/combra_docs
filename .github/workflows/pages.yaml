name: Build and deploy
on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false
defaults:
  run:
    shell: bash
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          # combra requires >= 3.12; the drift check imports it.
          python-version: "3.12"
          cache: pip
          cache-dependency-path: docs/requirements.txt

      - name: Install documentation dependencies
        run: pip install -r docs/requirements.txt

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v6

      # combra is a private repo. When a token with read access is configured as
      # the COMBRA_TOKEN secret, install it and make the drift check FATAL; without
      # one the check still runs but is allowed to skip, so a fork's PR still builds.
      - name: Install combra (for the API-drift check)
        id: combra
        env:
          COMBRA_TOKEN: ${{ secrets.COMBRA_TOKEN }}
        run: |
          if [ -n "$COMBRA_TOKEN" ]; then
            pip install "combra @ git+https://x-access-token:${COMBRA_TOKEN}@github.com/dkagramanyan/combra.git"
            echo "strict=1" >> "$GITHUB_OUTPUT"
          else
            echo "COMBRA_TOKEN not set -- the API-drift check will skip."
            echo "strict=0" >> "$GITHUB_OUTPUT"
          fi

      # Guards the hand-authored py: directives against the real combra API. This is
      # the check whose absence let combra 0.5.0 remove three functions the model
      # repos import without anything noticing, so it gates whenever it can run.
      - name: Check API reference against combra
        env:
          COMBRA_DRIFT_STRICT: ${{ steps.combra.outputs.strict }}
        run: python docs/check_api_drift.py

      - name: Build the site (warnings are errors)
        run: python -m sphinx -b html -W --keep-going -j auto docs public

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./public

  deploy:
    # Only publish from the default branch; pull requests build but do not deploy.
    if: github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
