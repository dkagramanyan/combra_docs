name: Build and deploy
on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false
defaults:
  run:
    shell: bash
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # Belt-and-braces on top of the CPU-only torch install below: drop the
      # preinstalled toolchains this repo never uses, freeing ~15 GB. Note what
      # is NOT removed -- /opt/hostedtoolcache ($AGENT_TOOLSDIRECTORY), which
      # the snippets floating around delete, is where actions/setup-python puts
      # the interpreter this job runs on. `rm -rf` on an already-absent path is
      # a no-op, so a runner-image reshuffle degrades to freeing less rather
      # than failing the job; the `df` lines say how much was actually freed.
      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/local/lib/android \
                      /usr/share/dotnet \
                      /opt/ghc /usr/local/.ghcup \
                      /usr/local/share/boost
          df -h /

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          # combra requires >= 3.12; the drift check imports it.
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            docs/requirements.txt
            docs/constraints.txt

      - name: Install documentation dependencies
        # -c pins the exact transitive closure; requirements.txt only declares
        # floors, so without it CI silently drifts to whatever PyPI serves today.
        run: pip install -r docs/requirements.txt -c docs/constraints.txt

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v6

      # combra is a private repo, and since the API reference is generated from its
      # docstrings by autodoc, the site cannot be built without it -- there is no
      # degraded mode to fall back to. A fork without the secret fails here, with a
      # message saying why, rather than producing a site missing its reference.
      - name: Install combra (the API reference is generated from it)
        env:
          COMBRA_TOKEN: ${{ secrets.COMBRA_TOKEN }}
        run: |
          if [ -z "$COMBRA_TOKEN" ]; then
            echo "::error::COMBRA_TOKEN is not set. The API reference is generated" \
                 "from combra's docstrings by autodoc, so the package must be" \
                 "installed for the docs to build."
            exit 1
          fi
          # CPU-only torch first, so the resolver finds combra's `torch>=2.13`
          # floor already satisfied. The default PyPI wheel is the CUDA build,
          # which drags ~8 GB of nvidia-* libraries onto a runner with ~14 GB
          # free -- combra's own test job ran out of disk exactly this way. The
          # docs build imports combra for autodoc; it never runs a metric, let
          # alone on a GPU.
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          # A 403 here means the token reached GitHub and was refused on
          # permissions. GitHub words that refusal "Write access to repository not
          # granted" even when all the clone needs is read, so say what it means.
          if ! pip install "combra[metrics] @ git+https://x-access-token:${COMBRA_TOKEN}@github.com/dkagramanyan/combra.git"; then
            echo "::error::Installing combra failed. If the clone reported 403" \
                 "'Write access to repository not granted', COMBRA_TOKEN is a valid" \
                 "token that cannot read dkagramanyan/combra. For a fine-grained" \
                 "token, set Repository access to 'Only select repositories' ->" \
                 "dkagramanyan/combra (the default, 'Public repositories', cannot" \
                 "see it) and Permissions -> Repository permissions -> Contents:" \
                 "Read-only. A classic token needs the 'repo' scope."
            exit 1
          fi

      # autodoc makes a documented signature structurally incapable of drifting
      # from the code, which is why the old docs/check_api_drift.py is gone. The
      # one gap it leaves is a public name that no page lists -- such an object
      # silently never gets a page. This is that guard, and only that.
      - name: Check every public name is on a page
        run: python docs/check_api_coverage.py

      # Runs every runnable example: the ```{doctest}``` blocks on the hand-written
      # pages AND the ``Examples`` sections of the docstrings, which autodoc pulls
      # into the generated reference pages. Examples that cannot run in CI carry an
      # explicit ``# doctest: +SKIP``. This is what keeps an example from drifting
      # away from the code it documents.
      - name: Run the runnable doc examples
        run: python -m sphinx -b doctest -W --keep-going docs _doctest

      - name: Build the site (warnings are errors)
        run: python -m sphinx -b html -W --keep-going -j auto docs public

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./public

  deploy:
    # Only publish from the default branch; pull requests build but do not deploy.
    if: github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
